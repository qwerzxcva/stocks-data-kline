# 夜间全市场 K 线增量补录 (每日 03:00 CST = 19:00 UTC)
name: nightly-kline
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.GITHUB_TOKEN }} }
      - uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-tools
          path: tools-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Ensure dirs
        run: |
          mkdir -p data/kline/history data/bulk data/global data/bycode/{day,week,month}
          git add data/bulk data/global data/bycode 2>/dev/null || true
      - name: Index + global quotes
        env:
          STOCKS_KLINE_GLOBAL_DIR: ${{ github.workspace }}/data/global
        run: |
          python3 tools-repo/tools/fetch_history.py ${{ github.workspace }}/data/kline/history
          python3 tools-repo/tools/save_global_quotes.py
      - name: Full market klines (resumable, WAF-aware, 1 worker in Actions)
        env:
          STOCKS_KLINE_OUT: ${{ github.workspace }}/data/bulk
          STOCKS_UNIVERSE_FILE: ${{ github.workspace }}/meta/universe.csv
        run: python3 tools-repo/tools/fetch_all_market.py 1
      - name: Split to per-code
        env:
          STOCKS_KLINE_SRC: ${{ github.workspace }}/data/bulk
          STOCKS_KLINE_DST: ${{ github.workspace }}/data
        run: python3 tools-repo/tools/split_allmarket.py
      - name: Commit & push
        run: |
          git config user.name "stocks-bot"
          git config user.email "41888888888+stocks-bot@users.noreply.github.com"
          git add -A
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          git diff --quiet HEAD && echo "no changes" || {
            git commit -m "nightly-kline $ts" && \
            git -c http.version=HTTP/1.1 push origin main
          }
